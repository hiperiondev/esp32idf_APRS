## Managed-component dependencies for the sensors_local component.
##
## The esp-idf-lib BMP280 driver backs drivers/bme280/bme280.c (the default
## real weather sensor): that component is named after the BMP280 and covers
## the register-compatible BME280 as well. The BMP180 one backs
## drivers/bmp180/bmp180.c. Both are fetched unconditionally so either driver
## can be enabled from Kconfig without touching this file, and both
## transitively pull in esp-idf-lib/i2cdev.
## Delete dependencies.lock and let idf.py regenerate it on the first build
## after editing this file.
dependencies:
  esp-idf-lib/bmp180: "^1.0.7"
  esp-idf-lib/bmp280: "^1.0.7"
  idf:
    version: ">=5.1"
